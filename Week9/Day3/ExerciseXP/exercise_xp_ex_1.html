<!--
🌟 Exercise 1: Exploring JavaScript Variables and Data Types
Instructions
Create a JavaScript script that defines variables of different data types and logs them to the console.
Instructions

Create a new HTML file with a <script> tag.
Inside the <script> tag, declare variables of different data types (String, Number, Boolean, Undefined, Null).
Use console.log() to print each variable and its type to the browser console.
Open the HTML file in a web browser and inspect the console output.
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Exercise 1 - JavaScript Data Types</title>
</head>
<body>
  <h1>Exercise 1: JavaScript Variables and Data Types</h1>
  <p>Open the browser console (F12 ---> Console) to see each variable and its type.</p>

  <script>
    // `let` is used (not `var`) because it is block-scoped - the modern default.
    let myString = "Hello, JavaScript!"; // String
    let myNumber = 42; // Number (JS has a single Number type for ints and floats)
    let myBoolean = true; // Boolean
    let myUndefined; // Undefined - declared but never assigned
    let myNull = null; // Null - an intentional "no value"

    console.log(myString, typeof myString); // "string"
    console.log(myNumber, typeof myNumber); // "number"
    console.log(myBoolean, typeof myBoolean); // "boolean"
    console.log(myUndefined, typeof myUndefined); // "undefined"

    console.log(myNull, typeof myNull); // "object"
  </script>
</body>
</html>
